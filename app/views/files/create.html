{% extends "base.html" %}
{% block title %}Create file{% endblock %}

{% block content %}
<h2>Create</h2>
<h5 class="text-muted">File</h5>
<hr>

{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

<form method="post" action="/files/create" style="max-width: 520px">
    <div class="mb-3">
        <label class="form-label" for="filename">Filename</label>
        <input class="form-control" id="filename" name="filename" value="{{ model.filename }}"
               required maxlength="500">
    </div>

    <div class="mb-3">
        <label class="form-label" for="size_bytes">Size (bytes)</label>
        <input class="form-control" id="size_bytes" name="size_bytes" type="number"
               value="{{ model.size_bytes }}" required min="0">
    </div>

    <div class="mb-3">
        <label class="form-label" for="bucket_id">Bucket</label>
        <select class="form-select" id="bucket_id" name="bucket_id" required>
            <option value="" disabled {% if not model.bucket_id %}selected{% endif %}>— select bucket —</option>
            {% for bucket in buckets %}
            <option value="{{ bucket.id }}" {% if bucket.id == model.bucket_id %}selected{% endif %}>
                {{ bucket.name }} ({{ bucket.owner.username }}{% if bucket.is_shared %}, shared{% endif %})
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label" for="uploader_id">Uploader</label>
        <select class="form-select" id="uploader_id" name="uploader_id" required>
            <option value="" disabled {% if not model.uploader_id %}selected{% endif %}>— select user —</option>
            {% for user in users %}
            <option value="{{ user.id }}" {% if user.id == model.uploader_id %}selected{% endif %}>
                {{ user.username }} ({{ user.tier }})
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label" for="folder_id">Folder <span class="text-muted">(optional)</span></label>
        <select class="form-select" id="folder_id" name="folder_id">
            <option value="">— bucket root —</option>
            {% for folder in folders %}
            <option value="{{ folder.id }}" {% if folder.id == model.folder_id %}selected{% endif %}>
                {{ folder.bucket.name }} / {{ folder.name }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label" for="mime_type">MIME type <span class="text-muted">(optional)</span></label>
        <input class="form-control" id="mime_type" name="mime_type"
               value="{{ model.mime_type or '' }}" maxlength="255"
               placeholder="e.g. image/png">
    </div>

    <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="is_public" name="is_public"
               value="true" {% if model.is_public %}checked{% endif %}>
        <label class="form-check-label" for="is_public">Public file</label>
    </div>

    <button type="submit" class="btn btn-primary">Create</button>
</form>

<p class="mt-3"><a href="/files">Back to list</a></p>
{% endblock %}
