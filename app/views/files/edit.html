{% extends "base.html" %}
{% block title %}Edit {{ model.filename }}{% endblock %}

{% block content %}
<h2>Edit</h2>
<h5 class="text-muted">File</h5>
<hr>

{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

<form method="post" action="/files/{{ model.id }}/edit" style="max-width: 520px">
    <div class="mb-3">
        <label class="form-label" for="filename">Filename</label>
        <input class="form-control" id="filename" name="filename" value="{{ model.filename }}"
               required maxlength="500">
    </div>

    <div class="mb-3">
        <label class="form-label" for="bucket">Bucket</label>
        <input class="form-control" id="bucket" value="{{ model.bucket_name }} ({{ model.bucket_owner_username }})" disabled>
    </div>

    <div class="mb-3">
        <label class="form-label" for="folder_id">Folder</label>
        <select class="form-select" id="folder_id" name="folder_id">
            <option value="">— bucket root —</option>
            {% for folder in folders %}
            <option value="{{ folder.id }}" {% if folder.id == model.folder_id %}selected{% endif %}>
                {{ folder.name }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label" for="size">Size (bytes)</label>
        <input class="form-control" id="size" value="{{ model.size_bytes }}" disabled>
    </div>

    <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="is_public" name="is_public"
               value="true" {% if model.is_public %}checked{% endif %}>
        <label class="form-check-label" for="is_public">Public file</label>
    </div>

    <button type="submit" class="btn btn-primary">Save</button>
</form>

<p class="mt-3"><a href="/files">Back to list</a></p>
{% endblock %}
