{% extends "base.html" %}
{% block title %}Edit {{ model.name }}{% endblock %}

{% block content %}
<h2>Edit</h2>
<h5 class="text-muted">Bucket</h5>
<hr>

{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

<form method="post" action="/buckets/{{ model.id }}/edit" style="max-width: 520px">
    <div class="mb-3">
        <label class="form-label" for="name">Name</label>
        <input class="form-control" id="name" name="name" value="{{ model.name }}"
               required maxlength="255">
    </div>

    <div class="mb-3">
        <label class="form-label" for="owner">Owner</label>
        <input class="form-control" id="owner" value="{{ model.owner_username }} ({{ model.owner_tier }})" disabled>
    </div>

    <div class="mb-3">
        <label class="form-label" for="description">Description</label>
        <textarea class="form-control" id="description" name="description" rows="3"
                  maxlength="500">{{ model.description or "" }}</textarea>
    </div>

    <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="is_shared" disabled
               {% if model.is_shared %}checked{% endif %}>
        <label class="form-check-label" for="is_shared">Shared bucket</label>
    </div>

    <button type="submit" class="btn btn-primary">Save</button>
</form>

<p class="mt-3"><a href="/buckets">Back to list</a></p>
{% endblock %}
