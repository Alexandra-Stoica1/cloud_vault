{% extends "base.html" %}
{% block title %}Create bucket{% endblock %}

{% block content %}
<h2>Create</h2>
<h5 class="text-muted">Bucket</h5>
<hr>

{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

<form method="post" action="/buckets/create" style="max-width: 520px">
    <div class="mb-3">
        <label class="form-label" for="name">Name</label>
        <input class="form-control" id="name" name="name" value="{{ model.name }}"
               required maxlength="255">
    </div>

    <div class="mb-3">
        <label class="form-label" for="owner_id">Owner</label>
        <select class="form-select" id="owner_id" name="owner_id" required>
            <option value="" disabled {% if not model.owner_id %}selected{% endif %}>— select user —</option>
            {% for user in users %}
            <option value="{{ user.id }}" {% if user.id == model.owner_id %}selected{% endif %}>
                {{ user.username }} ({{ user.tier }})
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label" for="description">Description</label>
        <textarea class="form-control" id="description" name="description" rows="3"
                  maxlength="500">{{ model.description or "" }}</textarea>
    </div>

    <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="is_shared" name="is_shared"
               value="true" {% if model.is_shared %}checked{% endif %}>
        <label class="form-check-label" for="is_shared">Shared bucket</label>
    </div>

    <button type="submit" class="btn btn-primary">Create</button>
</form>

<p class="mt-3"><a href="/buckets">Back to list</a></p>
{% endblock %}
