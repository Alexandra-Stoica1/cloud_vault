<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %} - CloudVault</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/users">CloudVault</a>
            {% if request.state.admin %}
            <div class="navbar-nav me-auto">
                <a class="nav-link" href="/users">Users</a>
                <a class="nav-link" href="/buckets">Buckets</a>
                <a class="nav-link" href="/files">Files</a>
            </div>
            <form class="d-flex align-items-center" method="post" action="/logout">
                <span class="navbar-text me-3">{{ request.state.admin.username }}</span>
                <button type="submit" class="btn btn-outline-light btn-sm">Log out</button>
            </form>
            {% endif %}
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
        <hr>
        <footer class="text-muted small">&copy; 2026 - CloudVault</footer>
    </main>
</body>
</html>
